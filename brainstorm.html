<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design statement</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #fff;
      color: #111;
      line-height: 1.4;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 18px 80px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 800;
    }
    .sub {
      margin: 0 0 28px;
      font-size: 18px;
      color: #555;
    }
    .statement {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.55;
    }
    .statement .row {
      margin: 0 0 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 6px;
    }
    .blank {
      position: relative;
      display: inline-block;
      vertical-align: baseline;
      min-width: 160px;
    }
    .blank.wide { min-width: 220px; }
    .blank.xwide { min-width: 280px; }
    .blank.free { min-width: 260px; }
    .blank input {
      width: 100%;
      border: none;
      border-bottom: 3px solid #111;
      background: #f7f7f7;
      font: inherit;
      font-size: 24px;
      font-weight: 700;
      padding: 4px 8px;
      color: #111;
      border-radius: 4px 4px 0 0;
    }
    .blank input:focus {
      outline: none;
      background: #eee;
    }
    .suggest {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 2px);
      z-index: 20;
      max-height: 280px;
      overflow: auto;
      background: #fff;
      border: 2px solid #111;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      min-width: 260px;
    }
    .suggest.open { display: block; }
    .suggest button {
      display: block;
      width: 100%;
      border: none;
      background: #fff;
      text-align: left;
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      padding: 10px 12px;
      cursor: pointer;
      color: #111;
    }
    .suggest button:hover,
    .suggest button.active {
      background: #111;
      color: #fff;
    }
    .suggest .empty {
      padding: 12px;
      color: #666;
      font-size: 16px;
      font-weight: 600;
    }
    .have-block { margin: 28px 0 0; }
    .have-card {
      margin: 0 0 22px;
      padding: 0 0 8px;
    }
    .have-row, .power-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 6px;
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 700;
    }
    .have-card .remove {
      border: 2px solid #bbb;
      background: #fff;
      color: #666;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .have-card .remove:hover {
      border-color: #111;
      color: #111;
    }
    .plus-row { margin: 8px 0 24px; }
    .plus-row button,
    .actions button {
      border: 2px solid #111;
      background: #fff;
      color: #111;
      font: inherit;
      font-size: 20px;
      font-weight: 700;
      padding: 14px 18px;
      cursor: pointer;
      border-radius: 12px;
    }
    .plus-row button:hover,
    .actions button:hover { background: #f3f3f3; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }
    .actions .main {
      background: #111;
      color: #fff;
    }
    .actions .main:hover { background: #333; }
    .preview {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 2px solid #eee;
      font-size: 20px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .preview:empty { display: none; }
    .status {
      margin: 14px 0 0;
      font-size: 17px;
      color: #8d2f1d;
      min-height: 1.2em;
    }
    .results {
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 20px;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      line-height: 1.45;
    }
    .results:empty { display: none; }
  </style>
</head>

  <div class="wrap">
    <h1>Design statement</h1>
    <p class="sub">Fill in the blanks. Click a blank to search the list, or type your own idea.</p>

    <div class="statement" id="statement">
      <div class="row">
        <span>I want to build</span>
        <span class="blank wide" data-list="buildings"></span>
        <span>for</span>
        <span class="blank" data-list="who"></span>
        <span>to</span>
        <span class="blank xwide" data-list="activities"></span>
      </div>
    </div>

    <div class="have-block">
      <div id="haveRows"></div>
      <div class="plus-row">
        <button type="button" id="addHave" aria-label="Add another feature">+ It will have a ______ for ______</button>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="main" id="previewBtn">Show my statement</button>
      <button type="button" id="ideasBtn">Get invention ideas</button>
      <button type="button" id="clearBtn">Clear</button>
    </div>

    <div class="preview" id="preview"></div>
    <div class="status" id="status"></div>
    <div class="results" id="results"></div>
  </div>

    function mountBlank(host) {
      const listName = host.dataset.list || "";
      const free = host.dataset.free === "1" || !listName;
      const input = document.createElement("input");
      input.type = "text";
      input.autocomplete = "off";
      input.spellcheck = false;
      input.placeholder = "";
      host.append(input);
      host._input = input;
      host._listName = listName;
      host._free = free;

      if (free) return;

      input.setAttribute("aria-autocomplete", "list");
      input.setAttribute("role", "combobox");
      input.setAttribute("aria-expanded", "false");

      const suggest = document.createElement("div");
      suggest.className = "suggest";
      suggest.setAttribute("role", "listbox");
      host.append(suggest);
      host._suggest = suggest;

      input.addEventListener("focus", () => openSuggest(host));
      input.addEventListener("input", () => openSuggest(host));
      input.addEventListener("keydown", (e) => onBlankKey(e, host));

    function alphabetSample(list, perLetter, limit) {
      const buckets = {};
      for (const item of list) {
        const ch = (item[0] || "").toUpperCase();
        if (ch < "A" || ch > "Z") continue;
        if (!buckets[ch]) buckets[ch] = [];
        if (buckets[ch].length < perLetter) buckets[ch].push(item);
      }
      const out = [];
      for (let code = 65; code <= 90; code++) {
        const letter = String.fromCharCode(code);
        const items = buckets[letter] || [];
        for (const item of items) {
          out.push(item);
          if (out.length >= limit) return out;
        }
      }
      return out;
    }

    function filterList(listName, query) {
      const list = LISTS[listName] || [];
      const q = query.trim().toLowerCase();
      if (!q) return alphabetSample(list, 2, 52);
      const starts = [];
      const contains = [];
      for (const item of list) {
        const low = item.toLowerCase();
        if (low.startsWith(q)) starts.push(item);
        else if (low.includes(q)) contains.push(item);
        if (starts.length >= 30 && contains.length >= 20) break;
      }
      return starts.slice(0, 30).concat(contains.slice(0, 20));
    }

    function openSuggest(host) {
      if (host._free) return;
      closeSuggest(true);
      openBlank = host;
      activeIndex = -1;
      const matches = filterList(host._listName, host._input.value);
      const box = host._suggest;
      box.replaceChildren();
      if (!matches.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No matches — type your own.";
        box.append(empty);
      } else {
        matches.forEach((item, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = item;
          btn.dataset.index = String(i);
          btn.addEventListener("mousedown", (e) => {
            e.preventDefault();
            chooseItem(host, item);
          });
          box.append(btn);
        });
      }
      box.classList.add("open");
      host._input.setAttribute("aria-expanded", "true");
    }

    function chooseItem(host, item) {
      host._input.value = item;
      closeSuggest();
      host._input.focus();
    }

    function closeSuggest(keepRef) {
      if (openBlank && openBlank._suggest) {
        openBlank._suggest.classList.remove("open");
        openBlank._input.setAttribute("aria-expanded", "false");
        if (!keepRef) openBlank = null;
      } else if (!keepRef) {
        openBlank = null;
      }
      activeIndex = -1;
    }

    function onBlankKey(e, host) {
      if (host._free) return;
      const buttons = [...host._suggest.querySelectorAll("button")];
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!host._suggest.classList.contains("open")) openSuggest(host);
        activeIndex = Math.min(activeIndex + 1, buttons.length - 1);
        paintActive(buttons);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        paintActive(buttons);
      } else if (e.key === "Enter") {
        if (activeIndex >= 0 && buttons[activeIndex]) {
          e.preventDefault();
          chooseItem(host, buttons[activeIndex].textContent);
        }
      } else if (e.key === "Escape") {
        closeSuggest();
      }
    }

    function paintActive(buttons) {
      buttons.forEach((btn, i) => btn.classList.toggle("active", i === activeIndex));
      if (buttons[activeIndex]) buttons[activeIndex].scrollIntoView({ block: "nearest" });
    }

        lines.push(
          "It will have a " + (h.feature || "__________") +
          " for " + (h.purpose || "__________") + "."
        );
        lines.push(
          "It is powered by " + (h.energy || "__________") +
          ": " + (h.describe || "__________") + "."
        );
      }
      return lines.join("\n");
    }

    function showPreview() {
      previewEl.textContent = buildStatementText();
      statusEl.textContent = "";
    }

    document.querySelectorAll("#statement .blank").forEach(mountBlank);
    addHaveRow();
    addHaveRow();
    addHaveRow();

    document.getElementById("addHave").addEventListener("click", () => {
      const card = addHaveRow();
      card.querySelector("input")?.focus();
    });

    document.getElementById("previewBtn").addEventListener("click", showPreview);

    document.getElementById("clearBtn").addEventListener("click", () => {
      document.querySelectorAll(".blank input").forEach((input) => { input.value = ""; });
      haveRowsEl.replaceChildren();
      addHaveRow();
      addHaveRow();
      addHaveRow();
      previewEl.textContent = "";
      resultsEl.textContent = "";
      statusEl.textContent = "";
    });

    function buildPrompt() {
      const text = buildStatementText();
      return [
        "The student is entering a low-carbon / nuclear-powered invention competition for KS2 kids (ages about 7–11).",
        "They must design something that uses nuclear power (electricity and/or leftover heat from nuclear power).",
        "They wrote this design statement:",
        text,
        "",
        "Please invent at least 8 different invention ideas that clearly use nuclear power and fit this design statement.",
        "For each idea use this format:",
        "1. Short title starting with or including 'Nuclear powered…'",
        "   One or two simple sentences a primary student could understand.",
        "Keep language simple. No scary technical detail. Do not refuse — creative classroom brainstorming only."
      ].join("\n");
    }

    function contentToText(content) {
      if (!content) return "";
      if (typeof content === "string") return content;
      if (Array.isArray(content)) {
        return content.map((part) => part?.text || part?.content || "").join("");
      }
      return "";
    }

    document.getElementById("ideasBtn").addEventListener("click", async () => {
      const { building, who, activity, haves } = statementValues();
      if (!building && !who && !activity && !haves.length) {
        statusEl.textContent = "Fill in at least one blank first.";
        return;
      }
      showPreview();
      statusEl.textContent = "Thinking of nuclear-powered ideas…";
      resultsEl.textContent = "";
      try {
        const response = await fetch("https://api.poe.com/v1/chat/completions", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + API_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: MODEL,
            stream: false,
            messages: [
              {
                role: "system",
                content: "You help primary students brainstorm nuclear-powered invention ideas for a school competition. Be clear, kind, and creative."
              },
              { role: "user", content: buildPrompt() }
            ]
          })
        });
        if (!response.ok) {
          const raw = await response.text();
          throw new Error(raw || ("HTTP " + response.status));
        }
        const data = await response.json();
        resultsEl.textContent = contentToText(data.choices?.[0]?.message?.content) || "(empty reply)";
        statusEl.textContent = "";
      } catch (error) {
        const message = error.message || "Request failed";
        statusEl.textContent = message === "Failed to fetch"
          ? "Browser blocked the request. Serve this folder over http (e.g. python3 -m http.server)."
          : message;
      }
    });

    document.addEventListener("click", (e) => {
      if (openBlank && !openBlank.contains(e.target)) closeSuggest();
    });
  </script>
</body>
</html>
