        idea: "A desk lamp with a visible focus timer so students study in short blocks and put the phone aside.",
        en: "The idea started when classmates said phones steal their homework time after dinner. I also kept hearing debates about screen time during form periods and STEM club chats. I want a focus lamp for teenagers so they can finish homework with fewer distractions. That push made me choose a simple light-and-timer design instead of a complicated phone app full of menus.",

        zh: "靈感來自看見輪椅使用者與長者在巴士門檻高度不一時猶豫，雨天更危險。無障礙交通倡議影響了我的優先次序。我想為殘疾人士發明上車門檻警示燈，提升安全感。這個靈感讓我決定把車門光號與司機提示做成同一系統，讓上落車更可預期，減少意外。我也希望這個設計能在學校展覽中清楚說明問題與解決方法。"
      },
      {
        t: "Exam stress breath booth",
        theme: "Education",
        who: "Teenagers/student",
        idea: "A one-person booth with guided breathing lights outside exam halls.",
        en: "Friends shaking before exams made me look for a calm tool that does not force talking. Youth mental-health support trends influenced the gentle tone I wanted. I want a breath booth for students so they can settle nerves privately before papers. That push made the sequence visual, short, quiet, and completely judgement-free.",
        zh: "靈感來自朋友考試前雙手發抖，需要一個不用開口的冷靜工具。青少年精神健康支援趨勢影響了我。我想為學生發明呼吸引導小亭，讓人私下穩定情緒才進場。這個靈感讓我決定流程要短、全靠視覺、環境安靜且沒有批判，讓求助門檻降到最低也能保護尊嚴。我也希望這個設計能在學校展覽中清楚說明問題與解決方法。"
      },
      {
        t: "Family chore balance board",
        theme: "Smart living",
        who: "Family",
        idea: "A wall board that fairly rotates chores and celebrates finished tasks with lights.",
        en: "Arguments about who always washes dishes sparked this at home more than once. Fair-share family routines I saw online influenced the rotation logic. I want a chore board for families so housework feels clearer and fairer each week. This made automatic rotation and visible praise central, not just another cold duty checklist.",
        zh: "靈感來自家中反覆爭論總是誰洗碗、誰倒垃圾。網上公平分擔家務的做法影響了設計。我想為家庭發明家務輪值燈板，讓分工更清楚公平。這個靈感讓我決定自動輪更，並用燈光肯定完成，而不只是冷冰冰的工作清單，讓合作比較容易持續。我也希望這個設計能在學校展覽中清楚說明問題與解決方法。"
      },
      {
        t: "Beach plastic weigh station",
        theme: "Sustainability",
        who: "General public",
        idea: "A weekend station that weighs collected beach plastic and shows the group impact.",
        en: "After a beach clean I wondered where the bags went and whether our effort really mattered. Public ocean-plastic campaigns inspired a clearer feedback loop for volunteers. I want a weigh station for the public so clean-up groups can see impact together. That made instant totals, sorting guides, and photo records the core features.",
        zh: "靈感來自淨灘後想知道膠袋去了哪、努力有沒有被看見。海洋塑膠公眾行動啟發我做更清楚的回饋。我想為市民發明海灘塑膠稱重站，讓團隊看見成果。這個靈感讓我決定即時總量、分類指引與簡單紀錄是核心，把行動連到可見改變，鼓勵更多人再來。我也希望這個設計能在學校展覽中清楚說明問題與解決方法。"
      },
      {
        t: "Quiet library robot return",
        theme: "Education",
        who: "Particular occupation",
        idea: "A small robot that returns books to shelves for librarians after closing.",
        en: "Talking with a librarian about late-night shelf work sparked the idea for quieter help. Education staffing pressure and service robots influenced the direction. I want a return robot for librarians so books go back with less overtime strain. This made quiet wheels, careful shelf mapping, and obstacle stops the first requirements.",
        zh: "靈感來自與圖書館員談及夜間上架辛勞，加班很常見。教育人力壓力與服務機械人趨勢影響了我。我想為館員發明靜音還書機械人，減少加班負擔。這個靈感讓我決定先做好靜音輪、準確書架地圖與避障停止，讓工具真正減壓而不是在閉館後添亂。我也希望這個設計能在學校展覽中清楚說明問題與解決方法。"
      },
      {
        t: "Diabetes snack timing watch",
        theme: "Medical and healthcare",
        who: "Chronic patients",
        idea: "A watch that reminds snack timing around medicine and activity changes.",
        en: "A family member with diabetes described how timing snacks is harder on busy school days. Chronic-care self-management tools influenced the features I kept. I want a timing watch for chronic patients so routines stay steadier through the week. That inspiration made reminders adjustable, discreet in class, and linked to medicine times.",
        zh: "靈感來自家中糖尿病親友說忙碌上課日很難準時吃小食，也容易漏記藥物。慢性病自我管理工具影響了我。我想為長期病患者發明零食與藥物時機手錶，讓作息更穩。這個靈感讓我決定提醒可調校、在課堂低調，並連結用藥時間，減少尷尬與遺漏。我也希望這個設計能在學校展覽中清楚說明問題與解決方法。"
      },
      {
        t: "Playground inclusive swing seat",
        theme: "Creative solutions",
        who: "Children",
        idea: "A wider swing seat with side supports so children with weaker balance can join.",
        en: "I watched a child wait out of games because the swing seat felt too narrow and tippy. Inclusive playground design stories influenced what fairness should look like. I want a supportive swing for children so more friends can play together safely. This made stability and dignity more important than looking special or medical.",
        zh: "靈感來自看見孩子因盪千秋太窄不穩而只能旁觀，笑容消失。共融遊樂場設計故事影響了我對公平的想法。我想為兒童發明加側承托的寬座千秋，讓更多朋友一齊玩。這個靈感讓我決定把穩定與尊嚴放在「看起來特別」之前，讓玩樂真正開放給不同身體條件的孩子。我也希望這個設計能在學校展覽中清楚說明問題與解決方法。"
      },
    ];

    function wordCount(text) {
      const parts = text.trim().match(/[A-Za-z0-9'’-]+/g);
      return parts ? parts.length : 0;
    }
    function zhCount(text) {
      return [...text.replace(/\s+/g, "")].length;
    }

    const themeFilter = document.getElementById("themeFilter");
    const whoFilter = document.getElementById("whoFilter");
    [...new Set(IDEAS.map((x) => x.theme))].sort().forEach((t) => {
      const o = document.createElement("option");
      o.value = t; o.textContent = t; themeFilter.append(o);
    });
    [...new Set(IDEAS.map((x) => x.who))].sort().forEach((t) => {
      const o = document.createElement("option");
      o.value = t; o.textContent = t; whoFilter.append(o);
    });

    let filtered = IDEAS.slice();
    let i = 0;

    const oneTitle = document.getElementById("oneTitle");
    const oneTags = document.getElementById("oneTags");
    const oneIdea = document.getElementById("oneIdea");
    const oneEn = document.getElementById("oneEn");
    const oneZh = document.getElementById("oneZh");
    const oneEnCount = document.getElementById("oneEnCount");
    const oneZhCount = document.getElementById("oneZhCount");
    const num = document.getElementById("num");
    const total = document.getElementById("total");
    const fullList = document.getElementById("fullList");

    function applyFilter() {
      const th = themeFilter.value;
      const wh = whoFilter.value;
      filtered = IDEAS.filter((x) => (!th || x.theme === th) && (!wh || x.who === wh));
      rebuildList();
      show(0);
    }

    function rebuildList() {
      fullList.replaceChildren();
      filtered.forEach((idea) => {
        const li = document.createElement("li");
        const strong = document.createElement("strong");
        strong.textContent = idea.t + " · " + idea.theme + " · " + idea.who;
        const body = document.createElement("div");
        body.className = "mini";
        body.textContent = idea.idea + "\n\nEN: " + idea.en + "\n\n中: " + idea.zh;
        li.append(strong, body);
        fullList.appendChild(li);
      });
      total.textContent = String(filtered.length);
    }

    function show(n) {
      if (!filtered.length) {
        oneTitle.textContent = "No packs match these filters";
        oneTags.replaceChildren();
        oneIdea.textContent = "";
        oneEn.textContent = "";
        oneZh.textContent = "";
        oneEnCount.textContent = "";
        oneZhCount.textContent = "";
        num.textContent = "0";
        return;
      }
      i = ((n % filtered.length) + filtered.length) % filtered.length;
      const idea = filtered[i];
      oneTitle.textContent = (i + 1) + ". " + idea.t;
      oneTags.replaceChildren();
      [["Theme", idea.theme], ["Beneficiary", idea.who]].forEach(([k, v]) => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = k + ": " + v;
        oneTags.append(span);
      });
      oneIdea.textContent = idea.idea;
      oneEn.textContent = idea.en;
      oneZh.textContent = idea.zh;
      const ew = wordCount(idea.en);
      const zc = zhCount(idea.zh);
      oneEnCount.textContent = ew + " words (target 50–70)";
      oneEnCount.className = "count " + (ew >= 50 && ew <= 70 ? "ok" : "bad");
      oneZhCount.textContent = zc + " 字 (target 120–150)";
      oneZhCount.className = "count " + (zc >= 120 && zc <= 150 ? "ok" : "bad");
      num.textContent = String(i + 1);
    }

    themeFilter.addEventListener("change", applyFilter);
    whoFilter.addEventListener("change", applyFilter);
    document.getElementById("prevBtn").addEventListener("click", () => show(i - 1));
    document.getElementById("nextBtn").addEventListener("click", () => show(i + 1));
    document.getElementById("randBtn").addEventListener("click", () => {
      if (!filtered.length) return;
      let n;
      do { n = Math.floor(Math.random() * filtered.length); } while (n === i && filtered.length > 1);
      show(n);
    });

    rebuildList();
    show(0);
  </script>
</body>
</html>
